name: Deploy site

on:
  push:
    branches: [main]
    paths: ["data/**", "observations/**", "collection_health.py", "collection_policy.json", "source_audit.py", "source_audit.json",
            "gen_site.py", "data_catalog.py", "hospitals.json",
            ".github/workflows/pages.yml"]
  # The scrape workflow commits with the bot token, whose pushes never
  # trigger push-based deploys; a fixed later cron used to stand in, but
  # GitHub delays scheduled runs by hours and the scrape often started
  # after it. Chaining on completion is exact.
  workflow_run:
    workflows: ["Scrape hospital price files"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Failed scrapes can publish observations even when snapshots are rejected.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history for per-hospital change logs
          filter: blob:none  # catalog reads historical metadata, never old MRF blobs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate site
        run: python gen_site.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
