name: Deploy site

on:
  push:
    branches: [main]
    paths: ["data/**", "gen_site.py", "hospitals.json",
            ".github/workflows/pages.yml"]
  # The scrape workflow commits with the bot token, whose pushes never
  # trigger push-based deploys; a fixed later cron used to stand in, but
  # GitHub delays scheduled runs by hours and the scrape often started
  # after it. Chaining on completion is exact.
  workflow_run:
    workflows: ["Scrape hospital price files"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A failed scrape commits nothing, so there is nothing new to render.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history for per-hospital change logs
          filter: blob:none   # git log --format needs no blobs; skip the
                              # legacy shard pack (~0.5 GB) entirely

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate site
        run: python gen_site.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
