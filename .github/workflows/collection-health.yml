name: Collection freshness

on:
  schedule:
    - cron: "31 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# Serial issue updates prevent duplicate opening/reminder notifications.
concurrency:
  group: collection-incidents
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            collection_health.py
            collection_incidents.py
            collection_policy.json
            hospitals.json
            observations/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Track source incidents and check collectors
        run: python collection_incidents.py --apply
        env:
          GH_TOKEN: ${{ github.token }}
          INCIDENT_ASSIGNEE: lkowalcz
