name: Scrape hospital price files

on:
  schedule:
    - cron: "23 6 * * *"  # daily, 06:23 UTC (off-peak; odd minute avoids the top-of-hour rush)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install curl-impersonate
        run: |
          curl -sL -o ci.tar.gz https://github.com/lexiforest/curl-impersonate/releases/download/v2.1.0/curl-impersonate-v2.1.0.x86_64-linux-gnu.tar.gz
          mkdir -p "$RUNNER_TEMP/ci" && tar xzf ci.tar.gz -C "$RUNNER_TEMP/ci"
          echo "CURL_IMPERSONATE_BIN=$RUNNER_TEMP/ci/curl_chrome145" >> "$GITHUB_ENV"

      - name: Scrape
        run: python scrape.py
        env:
          MAX_DOWNLOAD_BYTES: "10000000000"

      - name: Compute price index
        run: python compute_index.py

      - name: Commit if changed
        run: |
          git config user.name "price-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ index-history.csv index-state.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            if git diff --cached --quiet -- data/; then
              echo "Index tick $(date -u +%F)" > commit_message.txt
            fi
            git commit -F commit_message.txt
            git push
          fi
