name: Scrape hospital price files

on:
  schedule:
    - cron: "23 6 * * *"  # daily, 06:23 UTC (off-peak; odd minute avoids the top-of-hour rush)
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated hospital slugs to scrape (default: all)"
        required: false

permissions:
  contents: write

# Two scrape runs racing would fight over the two-repo commit dance;
# queue instead.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # blob:none keeps historical pack blobs off the runner; the working
      # tree (meta, summaries, stored payloads) is still fully materialized.
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      # Companion raw repo (payer-level shards, ~12 GB working tree). Sparse
      # checkout materializes root files only — the scraper never reads old
      # shards, and the commit step below re-syncs exactly the slugs it
      # rewrote, so shard blobs are never downloaded here.
      - uses: actions/checkout@v4
        with:
          repository: lkowalcz/hospital-price-history-raw
          ssh-key: ${{ secrets.RAW_REPO_DEPLOY_KEY }}
          path: raw-repo
          filter: blob:none
          sparse-checkout: |
            /*
            !/data/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # zstd compresses summarized originals before cold storage; it is
          # preinstalled on ubuntu-latest, and this is a no-op then.
          command -v zstd >/dev/null || sudo apt-get install -y -q zstd >/dev/null

      - name: Install curl-impersonate
        # Refresh twice a year with check_impersonate.py (docs/OPERATIONS.md).
        # The wrapper name must match local_refetch.IMPERSONATE_WRAPPER;
        # tests/test_scrape.py pins them. Last checked 2026-09-02.
        env:
          CI_VERSION: v2.2.2
          CI_WRAPPER: curl_chrome150
        run: |
          curl -sL -o ci.tar.gz "https://github.com/lexiforest/curl-impersonate/releases/download/$CI_VERSION/curl-impersonate-$CI_VERSION.x86_64-linux-gnu.tar.gz"
          mkdir -p "$RUNNER_TEMP/ci" && tar xzf ci.tar.gz -C "$RUNNER_TEMP/ci"
          echo "CURL_IMPERSONATE_BIN=$RUNNER_TEMP/ci/$CI_WRAPPER" >> "$GITHUB_ENV"

      - name: Scrape
        run: python scrape.py
        env:
          MAX_DOWNLOAD_BYTES: "10000000000"
          RAW_REPO_DIR: ${{ github.workspace }}/raw-repo
          ONLY: ${{ inputs.only }}
          # Fetched daily by local_refetch.py from a residential IP instead
          # (runner IPs are blocked or the published links are dead). Keep in
          # sync with the lists there; tests/test_scrape.py checks this.
          SKIP: johns-hopkins,hopkins-bayview,hopkins-all-childrens,sibley-memorial,orlando-regional,hca-florida-kendall,tristar-centennial,yale-new-haven
          # Cold storage of summarized originals on the Internet Archive.
          # Both empty (secrets unset) leaves archiving off; see
          # docs/OPERATIONS.md for where the keys come from.
          IA_ACCESS_KEY_ID: ${{ secrets.IA_ACCESS_KEY_ID }}
          IA_SECRET_ACCESS_KEY: ${{ secrets.IA_SECRET_ACCESS_KEY }}
          # Summarized giants re-downloaded per run only to archive them or
          # to re-summarize them after a SUMMARY_VERSION bump (backfill).
          BACKFILL_PER_RUN: "2"

      - name: Compute price index
        run: python compute_index.py

      # Raw repo first, so meta.json in the main commit can pin the raw
      # commit that holds this snapshot's shards. For each rewritten slug:
      # drop its index entries (old shards are sparse — not on disk), then
      # stage whatever the scraper wrote. Net effect is an exact replacement,
      # including deletion when a hospital leaves sharded mode.
      - name: Commit raw repo
        id: raw
        run: |
          git -C raw-repo config user.name "price-history-bot"
          git -C raw-repo config user.email "actions@users.noreply.github.com"
          if [ -f changed_slugs.txt ]; then
            while read -r slug; do
              if [ -n "$slug" ]; then
                git -C raw-repo rm -r -q --cached --sparse --ignore-unmatch "data/$slug"
                if [ -d "raw-repo/data/$slug" ]; then
                  git -C raw-repo add --sparse "data/$slug"
                fi
              fi
            done < changed_slugs.txt
          fi
          if git -C raw-repo diff --cached --quiet; then
            echo "No raw changes."
          else
            git -C raw-repo commit -F "$GITHUB_WORKSPACE/commit_message.txt"
            git -C raw-repo pull --rebase --quiet
            git -C raw-repo push
          fi
          echo "sha=$(git -C raw-repo rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record raw commit in meta.json
        env:
          RAW_SHA: ${{ steps.raw.outputs.sha }}
        run: |
          python3 - <<'EOF'
          import json, os
          from pathlib import Path
          sha = os.environ["RAW_SHA"]
          p = Path("changed_slugs.txt")
          for slug in (p.read_text().split() if p.exists() else []):
              mp = Path("data") / slug / "meta.json"
              if not mp.exists():
                  continue
              meta = json.loads(mp.read_text())
              if (Path("raw-repo/data") / slug).is_dir():
                  meta["raw_commit"] = sha
              else:
                  meta.pop("raw_commit", None)
              mp.write_text(json.dumps(meta, indent=2) + "\n")
          EOF

      - name: Commit main repo
        run: |
          git config user.name "price-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ index-history.csv index-state.json index-anomalies.csv
          if git diff --cached --quiet; then
            echo "No changes."
          else
            if git diff --cached --quiet -- data/; then
              echo "Index tick $(date -u +%F)" > commit_message.txt
            fi
            git commit -F commit_message.txt
            # a push that landed mid-run (e.g. a code change) must not
            # sink the whole scrape's data commit
            git pull --rebase --quiet
            git push
          fi
